# Render.com Blueprint configuration for AmortizaFlow Web
services:
  - type: web
    name: amortizaflow
    runtime: node
    plan: free
    region: oregon # or frankfurt, ohio, singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TURSO_DATABASE_URL
        value: libsql://amortiza-francescotorres.aws-us-west-2.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
